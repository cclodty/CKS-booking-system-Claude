<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機 · 選擇場地</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F2EC}
a{color:#0B6E5F}a:hover{color:#08564A}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #0B6E5F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; color: #16222E; background: #3A434C; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; flex-shrink: 0"></div>
<section role="dialog" aria-label="選擇場地" style="flex-grow: 1; min-height: 0; background: #FBFAF7; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #D5D1C6"></span></div>
<div style="display: flex; align-items: center; padding: 4px 12px 8px 20px">
<h2 style="margin: 0; flex-grow: 1; font-family: 'Noto Serif TC',serif; font-size: 22px">選擇場地</h2>
<a href="Mobile.dc.html" aria-label="關閉" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16222E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
<div style="padding: 0 16px 10px">
<label style="display: flex; align-items: center; gap: 8px; height: 46px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #DAD6CC; border-radius: 12px; color: #5B6672">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0"></path></svg>
<input type="search" placeholder="搜尋場地名稱" aria-label="搜尋場地" value="{{q}}" onChange="{{onSearch}}" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font: inherit; font-size: 15px; background: transparent; color: #16222E">
</label>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #5B6672; padding: 0 4px">{{g.name}}</div>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E3E0D8; border-radius: 14px; overflow: hidden">
<sc-for list="{{g.rooms}}" as="r" hint-placeholder-count="3">
<a href="Mobile.dc.html" aria-current="{{r.current}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; box-sizing: border-box; text-decoration: none; color: #16222E; border-top: 1px solid {{r.divider}}; background: {{r.bg}}">
<img src="{{r.img}}" alt="" width="56" height="42" style="width: 56px; height: 42px; object-fit: cover; border-radius: 8px; flex-shrink: 0">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<strong style="font-size: 15px">{{r.name}}</strong>
<span style="font-size: 12px; color: {{r.metaColor}}">{{r.meta}}</span>
</span>
<sc-if value="{{r.active}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg></sc-if>
</a>
</sc-for>
</div>
</div>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '' }; }
  renderVals() {
    const B = 'assets/';
    const ROOMS = [
      [1, '圖書館研討室(大)', '圖書館', '上限 12 人 · 直接預約', 'library-room-large.jpg'],
      [2, '圖書館研討室(小)', '圖書館', '上限 6 人 · 直接預約', 'library-room-small.jpg'],
      [4, '120室', '會議及講座', '直接預約', 'room-120.jpg'],
      [6, '219室', '會議及講座', '直接預約', 'room-219.jpg'],
      [7, '320室', '會議及講座', '直接預約', 'room-320.jpg'],
      [5, '音樂室', '專科室', '需經審批', 'music-room.jpg'],
      [8, '美術室', '專科室', '直接預約', 'art-room.jpg'],
      [13, '語言室', '專科室', '直接預約', 'language-room.jpg'],
      [11, 'STEAM實驗室A', '專科室', '直接預約', 'steam-lab-a.jpg'],
      [12, 'STEAM實驗室B', '專科室', '直接預約', 'steam-lab-b.jpg'],
      [3, '禮堂-舞台', '禮堂', '需經審批', 'hall-stage.jpg'],
      [9, '禮堂-前半場', '禮堂', '需經審批', 'hall-front.jpg'],
      [10, '禮堂-後半場', '禮堂', '需經審批', 'hall-back.jpg']
    ];
    const q = this.state.q.trim();
    const groups = ['圖書館', '會議及講座', '專科室', '禮堂'].map(g => ({
      key: g, name: g,
      rooms: ROOMS.filter(r => r[2] === g && r[1].includes(q)).map((r, i) => ({
        key: 'm' + r[0], name: r[1], meta: r[3], img: B + r[4], active: r[0] === 1, current: r[0] === 1 ? 'true' : 'false',
        bg: r[0] === 1 ? '#EEF7F4' : '#FFFFFF', divider: i === 0 ? 'transparent' : '#EEEBE4',
        metaColor: r[3] === '需經審批' ? '#8A4F00' : '#5B6672'
      }))
    })).filter(g => g.rooms.length);
    return { q: this.state.q, onSearch: e => this.setState({ q: e.target.value }), groups };
  }
}
</script>
</body>
</html>
