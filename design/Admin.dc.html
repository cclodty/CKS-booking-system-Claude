<body>
<x-dc>

<style>

<span style="font-family: 'Noto Serif TC',serif; font-size: 19px; font-weight: 700; letter-spacing: 0.02em">蔡高中學</span>
<span style="width: 1px; height: 18px; background: #D5D1C6"></span>
<span style="font-size: 15px; color: #3E4B58">場地預約</span>
</a>
<nav aria-label="主要功能" style="display: flex; align-items: stretch; gap: 4px; height: 64px">

<a href="Admin.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 15px; font-weight: 700; color: #16222E; text-decoration: none; box-shadow: inset 0 -3px 0 #0B6E5F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3z"></path></svg>管理工作台<span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: #B45309; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center" aria-label="5 項待審">5</span></a>
</nav>
<span style="flex-grow: 1"></span>
<span style="font-size: 13px; color: #5B6672">2026–27 學年</span>
<button style="height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #D5D1C6; background: #FFFFFF; border-radius: 10px; font-family: inherit; font-size: 14px; color: #16222E; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #16222E; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">王</span>王主任 · 超級管理員<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</header>

<div style="flex-grow: 1; min-height: 0; display: flex">
<nav aria-label="管理功能" style="width: 232px; flex-shrink: 0; box-sizing: border-box; padding: 20px 12px; border-right: 1px solid #E3E0D8; background: #FBFAF7; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #5B6672; padding: 4px 10px 8px">日常工作</div>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>預約管理</a>
<a href="Admin.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #16222E; text-decoration: none; background: #DCEEE8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v6l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"></path></svg><span style="flex-grow: 1">待審申請</span><span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 7px; border-radius: 11px; background: #B45309; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">5</span></a>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 4.9l14.2 14.2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"></path></svg>封鎖與授權碼</a>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V4h11v17M16 9h4v12M8 8h5M8 12h5M8 16h5"></path></svg>場地設定</a>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #5B6672; padding: 18px 10px 8px">全校設定</div>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2z"></path></svg>假期／禁借日期</a>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>學年與時段</a>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a6 6 0 0 0-12 0v2m16 0v-2a6 6 0 0 0-3-5M14 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0m3-3a4 4 0 0 1 0 7"></path></svg>管理員</a>
<a href="Admin.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: #16222E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l4 2"></path></svg>操作紀錄</a>
<span style="flex-grow: 1"></span>
<button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; background: transparent; border-radius: 10px; font-family: inherit; font-size: 14px; color: #3E4B58; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>修改密碼</button>
<button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; background: transparent; border-radius: 10px; font-family: inherit; font-size: 14px; color: #3E4B58; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H3v18h6m6-14 5 5-5 5m-8-5h13"></path></svg>登出</button>
</nav>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 28px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-end; gap: 16px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Noto Serif TC',serif; font-size: 28px; font-weight: 700">待審申請</h1>
<p style="margin: 0; font-size: 14px; color: #3E4B58">預設顯示本學年全部待審 · 待審不佔位，批准前系統會再核對撞期</p>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3E4B58">場地
<select style="height: 40px; padding: 0 10px; border: 1px solid #CFCAC0; border-radius: 10px; font-family: inherit; font-size: 14px; color: #16222E; background: #FFFFFF"><option>全部獲分配場地</option><option>音樂室</option><option>禮堂-舞台</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3E4B58">日期
<select style="height: 40px; padding: 0 10px; border: 1px solid #CFCAC0; border-radius: 10px; font-family: inherit; font-size: 14px; color: #16222E; background: #FFFFFF"><option>本學年</option><option>本週</option><option>未來 30 日</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3E4B58">搜尋
<input type="search" placeholder="姓名、用途、編號" value="{{kw}}" onChange="{{onKw}}" style="width: 200px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFCAC0; border-radius: 10px; font-family: inherit; font-size: 14px; color: #16222E">
</label>
</div>

<section aria-label="待審清單" style="background: #FFFFFF; border: 1px solid #E3E0D8; border-radius: 16px; overflow: hidden">
<div style="display: grid; grid-template-columns: 40px 150px 170px 130px minmax(0, 1fr) 210px 170px; gap: 12px; align-items: center; padding: 10px 16px; background: #FBFAF7; border-bottom: 1px solid #EEEBE4; font-size: 12px; font-weight: 700; color: #5B6672">
<input type="checkbox" checked="{{allOn}}" onChange="{{toggleAll}}" aria-label="選取本頁可批准的申請">
<span>日期</span><span>時段</span><span>場地</span><span>申請人及用途</span><span>撞期檢查</span><span style="text-align: right">操作</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 40px 150px 170px 130px minmax(0, 1fr) 210px 170px; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #EEEBE4; background: {{it.bg}}">
<input type="checkbox" checked="{{it.checked}}" onChange="{{it.toggle}}" disabled="{{it.conflict}}" aria-label="{{it.aria}}">
<div style="display: flex; flex-direction: column"><strong style="font-size: 15px">{{it.date}}</strong><span style="font-size: 12px; color: #5B6672">{{it.far}}</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px">{{it.slots}}</span><span style="font-size: 12px; color: #5B6672; font-variant-numeric: tabular-nums">{{it.time}}</span></div>
<span style="font-size: 14px">{{it.room}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px"><strong>{{it.who}}</strong> · {{it.dept}}</span>
<span style="font-size: 13px; color: #3E4B58">{{it.purpose}}</span>
<sc-if value="{{it.series}}" hint-placeholder-val="{{false}}"><a href="Admin.dc.html" style="font-size: 12px; font-weight: 700; text-decoration: none">長期 · 查看整組 6 次 →</a></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: {{it.checkFg}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.checkIcon}}"></path></svg>{{it.checkText}}
</div>
<div style="display: flex; gap: 6px; justify-content: flex-end">
<button style="height: 34px; padding: 0 12px; border: 1px solid #D5D1C6; background: #FFFFFF; border-radius: 8px; font-family: inherit; font-size: 13px; color: #16222E; cursor: pointer">拒絕</button>
<button disabled="{{it.conflict}}" style="height: 34px; padding: 0 12px; border: 0; background: {{it.okBg}}; color: {{it.okFg}}; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">批准</button>
</div>
</div>
</sc-for>
</section>

<span style="flex-grow: 1"></span>
<div style="position: sticky; bottom: 0; margin: 0 -28px; padding: 14px 28px; background: #16222E; color: #FFFFFF; display: flex; align-items: center; gap: 12px">
<strong style="flex-grow: 1; font-size: 15px" aria-live="polite">{{barLabel}}</strong>
<button disabled="{{none}}" style="height: 40px; padding: 0 16px; border: 1px solid #5B6672; background: transparent; color: #FFFFFF; border-radius: 10px; font-family: inherit; font-size: 14px; cursor: pointer">拒絕所選…</button>
<button disabled="{{none}}" style="height: 40px; padding: 0 18px; border: 0; background: {{bulkBg}}; color: {{bulkFg}}; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{bulkLabel}}</button>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kw: '', on: { a: true, c: true, d: true } };
  }
  renderVals() {
    const s = this.state;
    const OK = 'm5 12 4 4L19 6', WARN = 'M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z';
    const RAW = [
      { k: 'a', date: '10月8日（四）', far: '11 日後', slots: '第 6–7 節', time: '14:00–15:30', room: '音樂室', who: '何老師', dept: '音樂科', purpose: '合唱團練習 · 35 人', series: true, conflict: false },
      { k: 'b', date: '10月15日（四）', far: '18 日後', slots: '第 6–7 節', time: '14:00–15:30', room: '音樂室', who: '何老師', dept: '音樂科', purpose: '合唱團練習 · 35 人', series: true, conflict: true },
      { k: 'c', date: '10月9日（五）', far: '12 日後', slots: '放學後', time: '16:15–17:45', room: '禮堂-舞台', who: '梁同學', dept: 'F5A', purpose: '戲劇學會綵排 · 40 人', series: false, conflict: false },
      { k: 'd', date: '10月12日（一）', far: '15 日後', slots: '第 3–4 節', time: '10:05–11:35', room: '禮堂-前半場', who: '周老師', dept: '輔導組', purpose: '生涯講座 · 30 人', series: false, conflict: false },
      { k: 'e', date: '11月20日（五）', far: '54 日後', slots: '第 1–5 節', time: '08:30–12:20', room: '禮堂-舞台', who: '黃老師', dept: '科學科', purpose: '科學週開幕禮 · 60 人', series: false, conflict: false }
    ];
    const q = s.kw.trim();
    const shown = RAW.filter(r => !q || (r.who + r.dept + r.purpose + r.room).includes(q));
    const items = shown.map(r => ({
      key: r.k, date: r.date, far: r.far, slots: r.slots, time: r.time, room: r.room, who: r.who, dept: r.dept, purpose: r.purpose, series: r.series,
      conflict: r.conflict, checked: !r.conflict && !!s.on[r.k],
      bg: r.conflict ? '#FDF6F5' : s.on[r.k] ? '#F2F9F6' : '#FFFFFF',
      checkFg: r.conflict ? '#9B1C10' : '#0B5C4F', checkIcon: r.conflict ? WARN : OK,
      checkText: r.conflict ? '已有成立預約佔用課節' : '沒有撞期，可批准',
      okBg: r.conflict ? '#E3E0D8' : '#0B6E5F', okFg: r.conflict ? '#5B6672' : '#FFFFFF',
      aria: '選取 ' + r.date + ' ' + r.room + ' ' + r.who,
      toggle: () => this.setState({ on: Object.assign({}, this.state.on, { [r.k]: !this.state.on[r.k] }) })
    }));
    const selectable = items.filter(i => !i.conflict);
    const n = selectable.filter(i => i.checked).length;
    return {
      kw: s.kw, onKw: e => this.setState({ kw: e.target.value }), items,
      allOn: selectable.length > 0 && n === selectable.length,
      toggleAll: () => { const all = n !== selectable.length, on = {}; selectable.forEach(i => { on[i.key] = all; }); this.setState({ on: Object.assign({}, this.state.on, on) }); },
      none: n === 0, barLabel: n ? '已選 ' + n + ' 項申請' : '勾選申請後可批量處理',
      bulkLabel: n ? '核對並批准 ' + n + ' 項' : '核對並批准', bulkBg: n ? '#5FD0B6' : '#3E4B58', bulkFg: n ? '#0B2A24' : '#9AA3AD'
    };
  }
}
</script>
</body>
</html>
